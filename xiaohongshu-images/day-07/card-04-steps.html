<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1024px; height:1536px; position:relative; overflow:hidden; background:linear-gradient(170deg,#F8F4EF,#E8E0D3); font-family:sans-serif; margin:0; }
.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.48; }
.overlay { position:absolute; inset:0; background:rgba(248,244,239,0.25); }
.t { position:absolute; top:100px; left:80px; width:680px; }
.tag { display:inline-block; background:#8B7355; color:#fff; padding:5px 18px; border-radius:16px; font-size:15px; letter-spacing:2px; font-family:'Noto Sans SC',sans-serif; margin-bottom:20px; }
.h { font-size:58px; color:#2C2C2C; font-weight:700; letter-spacing:5px; line-height:1.2; font-family:'Noto Serif SC',serif; }
.body { margin-top:28px; font-size:22px; color:#555; line-height:2; font-family:'Noto Sans SC',sans-serif; }
.hl { color:#8B7355; font-weight:600; }
</style>
</head>
<body>
<img class="bg" src="bg-step3-glazing.png">
<div class="overlay"></div>
<div class="t">
  <div class="tag">四步工艺</div>
  <div class="h">打印只是第一步<br>后面还有三步</div>
  <div class="body">
    3D 打印成形 →<br>
    <span class="hl">手工上釉</span>（手的温度）→<br>
    <span class="hl">1280°C 窑烧</span>（火的意志）。<br><br>
    我们只是把「成形」这一步，<br>
    从「手」换成了「打印机」。<br><br>
    其他的，<strong style="color:#8B7355;">原封不动。</strong>
  </div>
</div>
</body>
</html>
