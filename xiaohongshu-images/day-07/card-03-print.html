<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1024px; height:1536px; position:relative; overflow:hidden; background:#F8F4EF; font-family:sans-serif; margin:0; }
.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.48; }
.overlay { position:absolute; inset:0; background:rgba(248,244,239,0.25); }
.t { position:absolute; top:80px; left:80px; right:80px; }
.tag { display:inline-block; background:#8B7355; color:#fff; padding:5px 18px; border-radius:16px; font-size:15px; letter-spacing:2px; font-family:'Noto Sans SC',sans-serif; margin-bottom:20px; }
.h { font-size:54px; color:#2C2C2C; font-weight:700; letter-spacing:5px; line-height:1.2; font-family:'Noto Serif SC',serif; }
.b { position:absolute; bottom:100px; left:80px; right:80px; font-size:22px; color:#555; line-height:2; font-family:'Noto Sans SC',sans-serif; }
.b strong { color:#8B7355; }
</style>
</head>
<body>
<img class="bg" src="bg-step2-printer.png">
<div class="overlay"></div>
<div class="t">
  <div class="tag">不是取代</div>
  <div class="h">手工做不了的<br>用打印来做</div>
</div>
<div class="b">
  茶壶的中空夹壁——拉坯<strong>做不出双层</strong>。<br>
  香粉盒的微米级密合——手工打泥条<strong>做不到这个精度</strong>。<br>
  每一条 G2 连续曲线——靠手感<strong>做不到数学意义上的完美</strong>。<br><br>
  3D 打印不是来抢饭碗的。<br>
  它是来回答手工回答不了的问题的。
</div>
</body>
</html>
