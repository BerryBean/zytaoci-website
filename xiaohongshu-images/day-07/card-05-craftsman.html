<!DOCTYPE html>
<html>
<head>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

.h { font-size:68px; color:#2C2C2C; font-weight:700; letter-spacing:5px; line-height:1.2; font-family:'Noto Serif SC',serif; }
.b { position:absolute; bottom:100px; left:80px; right:80px; font-size:22px; color:#555; line-height:2.1; font-family:'Noto Sans SC',sans-serif; }
.b strong { color:#8B7355; }
.ft { position:absolute; bottom:42px; left:0; right:0; text-align:center; font-size:13px; color:#bbb; letter-spacing:5px; font-family:'Noto Sans SC',sans-serif; }
</style>
</head>
<body>
<img class="bg" src="bg-step4-kiln.png">
<div class="overlay"></div>
<div class="t">
  <div class="tag">匠人精神</div>
  <div class="h">数字时代<br>的匠人</div>
</div>
<div class="b">
  匠人，从来不是靠工具定义的。<br><br>
  手拉坯是工具，<br>
  3D 打印机也是工具。<br><br>
  关键是——<br>
  做器物的人，<br>
  有没有那颗<strong>「不惜工」</strong>的心。<br><br>
  所以，这算匠人吗？<br>
  <strong>算。算数字时代的匠人。</strong>

<div class="ft">正窑 · ZHENGYAO</div>
