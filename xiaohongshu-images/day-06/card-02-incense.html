<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1024px; height:1536px; position:relative; overflow:hidden; background:#F8F4EF; font-family:sans-serif; margin:0; }
.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.75; }
.t { position:absolute; top:80px; left:80px; right:80px; }
.tag { display:inline-block; background:#8B7355; color:#fff; padding:5px 18px; border-radius:16px; font-size:15px; letter-spacing:2px; font-family:'Noto Sans SC',sans-serif; margin-bottom:20px; }
.h { font-size:68px; color:#2C2C2C; font-weight:700; letter-spacing:5px; line-height:1.2; font-family:'Noto Serif SC',serif; }
.b { position:absolute; bottom:100px; left:80px; right:80px; font-size:22px; color:#555; line-height:1.9; font-family:'Noto Sans SC',sans-serif; }
.b strong { color:#8B7355; }
</style>
</head>
<body>
<img class="bg" src="bg-02-incense.png">
<div class="t">
  <div class="tag">香 炉</div>
  <div class="h">炭火微光<br>透瓷而出</div>
</div>
<div class="b">
  炭火在炉底，香粉在上。<br>
  温度透过白瓷，温而不烫——<br>
  因为用了<strong>中空夹壁</strong>设计。<br><br>
  香炉要稳、要聚气、要不抢香。<br>
  <strong>器物不语，炭火自有分寸。</strong>
</div>
</body>
</html>
