<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1024px; height:1536px; position:relative; overflow:hidden; background:linear-gradient(170deg,#F8F4EF,#E8E0D3); font-family:sans-serif; margin:0; }
.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.65; }
.t { position:absolute; top:100px; left:80px; width:680px; }
.tag { display:inline-block; background:#8B7355; color:#fff; padding:5px 18px; border-radius:16px; font-size:15px; letter-spacing:2px; font-family:'Noto Sans SC',sans-serif; margin-bottom:20px; }
.h { font-size:60px; color:#2C2C2C; font-weight:700; letter-spacing:5px; line-height:1.2; font-family:'Noto Serif SC',serif; }
.body { margin-top:28px; font-size:22px; color:#555; line-height:1.9; font-family:'Noto Sans SC',sans-serif; }
.hl { color:#8B7355; font-weight:600; }
</style>
</head>
<body>
<img class="bg" src="bg-04-box.png">
<div class="t">
  <div class="tag">香 粉 盒</div>
  <div class="h">密封的不是香粉<br>是时间的味道</div>
  <div class="body">
    盖子与盒身<span class="hl">微米级密合</span>。<br><br>
    开盖时那一瞬间，<br>
    香味才第一次遇见空气。<br><br>
    不玩香的人觉得它只是个盒子。<br>
    玩香的人知道，<br>
    <strong style="color:#8B7355;">一个好盒子，值一炉好香。</strong>
  </div>
</div>
</body>
</html>
