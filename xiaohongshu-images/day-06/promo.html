<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 06 Promo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1024px; height:1536px; overflow:hidden; background:#F5F0E8; font-family:'PingFang SC','Noto Sans SC',sans-serif; position:relative; }

  .bg-img {
    position:absolute; top:0; left:0;
    width:100%; height:100%;
    object-fit:cover;
    opacity:0.35;
  }

  .content {
    position:relative; z-index:2;
    height:100%;
    display:flex; flex-direction:column;
    justify-content:flex-end;
    padding:80px 72px;
    background:linear-gradient(to top, rgba(245,240,232,0.95) 0%, rgba(245,240,232,0.6) 40%, transparent 100%);
  }

  .date {
    font-size:20px;
    color:#8B7355;
    letter-spacing:4px;
    margin-bottom:24px;
    font-weight:500;
  }

  .title {
    font-family:'Noto Serif SC','Songti SC','STSong',serif;
    font-size:64px;
    font-weight:700;
    color:#2C2C2C;
    line-height:1.35;
    margin-bottom:32px;
    max-width:820px;
  }

  .subtitle {
    font-size:26px;
    color:#666;
    line-height:1.8;
    max-width:720px;
    letter-spacing:1px;
  }

  .brand {
    position:absolute;
    top:60px; right:72px;
    font-size:18px;
    color:#8B7355;
    letter-spacing:3px;
    font-weight:600;
  }

  .divider {
    width:80px; height:3px;
    background:#8B7355;
    margin-bottom:28px;
    border-radius:2px;
  }
</style>
</head>
<body>

  <img class="bg-img" src="card-01-cover.png" alt="">

  <div class="brand">正窑 ZHENGYAO</div>

  <div class="content">
    <div class="date">2026.06.11</div>
    <div class="divider"></div>
    <div class="title">炉、瓶、盒。<br>三件事，古人叫<br>「炉瓶三事」</div>
    <div class="subtitle">香炉、著瓶、香粉盒——三件器物，各司其职。<br>不是炫富，是修行。</div>
  </div>

</body>
</html>
