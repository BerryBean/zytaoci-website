<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1024px; height:1536px; position:relative; overflow:hidden; background:#3C2F1E; font-family:sans-serif; margin:0; }
.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.50; }
.c { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:0 80px; text-align:center; }
.tag { display:inline-block; border:1px solid rgba(200,170,120,0.5); color:rgba(200,170,120,0.9); padding:5px 18px; border-radius:16px; font-size:15px; letter-spacing:2px; font-family:'Noto Sans SC',sans-serif; margin:0 auto 28px; width:fit-content; }
.h { font-size:68px; color:#F5EDE0; font-weight:700; letter-spacing:5px; line-height:1.3; font-family:'Noto Serif SC',serif; }
.b { margin-top:32px; font-size:22px; color:rgba(255,255,255,0.5); line-height:1.9; font-family:'Noto Sans SC',sans-serif; }
.brand { position:absolute; bottom:60px; left:0; right:0; text-align:center; font-size:13px; color:rgba(255,255,255,0.25); letter-spacing:6px; }
</style>
</head>
<body>
<img class="bg" src="bg-05-set.png">
<div class="c">
  <div class="tag">三 件 套</div>
  <div class="h">不是炫富<br>是修行</div>
  <div class="b">
    三件摆在一起，<br>
    就是一整套完整的香道仪式。<br><br>
    炉是<span style="color:rgba(200,170,120,0.9);">静</span>，瓶是<span style="color:rgba(200,170,120,0.9);">序</span>，盒是<span style="color:rgba(200,170,120,0.9);">藏</span>。<br>
    三件事，缺一不可。
  </div>
</div>
<div class="brand">正窑 · ZHENGYAO</div>
</body>
</html>
