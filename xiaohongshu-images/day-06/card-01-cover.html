<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1024px; height:1536px; position:relative; overflow:hidden; background:#F8F4EF; font-family:sans-serif; margin:0; padding:0; }
.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.55; }
.overlay { position:absolute; inset:0; background:linear-gradient(180deg,rgba(248,244,239,0.15),rgba(248,244,239,0.5)); }
.c { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.brand { font-size:17px; color:#8B7355; letter-spacing:8px; margin-bottom:20px; font-family:'Noto Sans SC',sans-serif; }
.title { font-size:64px; color:#2C2C2C; font-weight:700; letter-spacing:6px; text-align:center; line-height:1.3; font-family:'Noto Serif SC',serif; }
.div { width:80px; height:2px; background:#8B7355; margin:28px auto; }
.sub { font-size:24px; color:#8B7355; letter-spacing:4px; }
.ft { position:absolute; bottom:56px; left:0; right:0; text-align:center; font-size:13px; color:#bbb; letter-spacing:5px; font-family:'Noto Sans SC',sans-serif; }
</style>
</head>
<body>
<img class="bg" src="bg-01-cover.png">
<div class="overlay"></div>
<div class="c">
  <div class="brand">正窑 · ZHENGYAO</div>
  <div class="title">炉、瓶、盒<br>三件事</div>
  <div class="div"></div>
  <div class="sub">古人叫「炉瓶三事」</div>
</div>
<div class="ft">数字时代的手工精神工房</div>
</body>
</html>
