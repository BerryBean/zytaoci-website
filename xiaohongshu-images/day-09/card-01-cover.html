<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1024px; height:1536px; position:relative; overflow:hidden; background:#F8F4EF; font-family:sans-serif; margin:0; }
.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.48; }
.overlay { position:absolute; inset:0; background:rgba(248,244,239,0.25); }
.ft { position:absolute; bottom:56px; left:0; right:0; text-align:center; font-size:13px; color:#bbb; letter-spacing:5px; font-family:'Noto Sans SC',sans-serif; }
.c { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px; }
.brand { font-size:13px; color:#8B7355; letter-spacing:5px; margin-bottom:32px; font-family:'Noto Sans SC',sans-serif; }
.title { font-size:56px; color:#2C2C2C; font-weight:700; letter-spacing:4px; text-align:center; line-height:1.5; font-family:'Noto Serif SC',serif; }
.div { width:80px; height:2px; background:#8B7355; margin:28px auto; }
.sub { font-size:22px; color:#555; line-height:2; text-align:center; font-family:'Noto Sans SC',sans-serif; }
</style>
</head>
<body>
<img class="bg" src="bg-01-glazing.png">
<div class="overlay"></div>
<div class="c">
  <div class="brand">正窑 · 工艺</div>
  <div class="title">3D 打印只是成型<br>上釉这一步<br>是手的温度</div>
  <div class="div"></div>
  <div class="sub"></div>
</div>
<div class="ft">数字时代的手工精神工房</div>
</body>
</html>
