<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1024px; height:1536px; overflow:hidden; }
.card-4 { width:1024px; height:1536px; position:relative; overflow:hidden; background:linear-gradient(180deg,#F8F4EF 0%,#E8E2D9 100%); }
.center-block { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:100px 70px; }
.big-line { font-family:'Noto Serif SC',serif; font-size:44px; color:#2C2C2C; text-align:center; line-height:1.7; font-weight:600; }
.divider { width:80px; height:2px; background:#8B7355; margin:60px auto; }
.small-line { font-family:'Noto Sans SC',sans-serif; font-size:26px; color:#8B7355; text-align:center; line-height:1.8; }
.highlight { display:inline-block; background:rgba(139,115,85,0.12); padding:4px 14px; border-radius:4px; font-weight:600; }
.footer { position:absolute; bottom:80px; left:0; right:0; text-align:center; font-size:18px; color:#999; letter-spacing:6px; }
</style>
</head>
<body>
<div class="card-4">
  <div class="center-block">
    <div class="big-line">泥还是河北曲阳那片泥</div>
    <div class="big-line">釉还是透明的定窑釉</div>
    <div class="big-line">窑火还是 <span class="highlight">1280°C</span></div>
    <div class="divider"></div>
    <div class="small-line">变的，只是「成形」这一步。</div>
    <div class="small-line">从一个工匠的手，</div>
    <div class="small-line">变成一台 3D 打印机的手。</div>
    <div class="small-line" style="margin-top:30px;">—— 跨越千年的对话 ——</div>
  </div>
  <div class="footer">@正窑陶瓷艺术工作室</div>
</div>
</body>
</html>
