<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1024px; height:1536px; overflow:hidden; }
.card-1 { width:1024px; height:1536px; position:relative; overflow:hidden; background:#F8F4EF; }
.bg-img { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; opacity:0.55; }
.overlay-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 70px; }
.logo-text { font-family:'Noto Serif SC','STSong',serif; font-size:42px; color:#8B7355; letter-spacing:18px; margin-bottom:50px; font-weight:600; }
.title { font-family:'Noto Serif SC','STSong',serif; font-size:52px; color:#2C2C2C; text-align:center; line-height:1.5; font-weight:700; max-width:780px; }
.subtitle { font-family:'Noto Sans SC',sans-serif; font-size:24px; color:#8B7355; margin-top:40px; letter-spacing:8px; }
.footer { position:absolute; bottom:80px; left:0; right:0; text-align:center; font-size:18px; color:#999; letter-spacing:6px; }
</style>
</head>
<body>
<div class="card-1">
  <img class="bg-img" src="../../images/tea-set-group.png">
  <div class="overlay-center">
    <div class="logo-text">正 窑</div>
    <div class="title">千年定窑，<br>用 3D 打印机做出来，<br>会怎样？</div>
    <div class="subtitle">Zhengyao Ceramic</div>
  </div>
  <div class="footer">@正窑陶瓷艺术工作室</div>
</div>
</body>
</html>
