<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1024px; height:1536px; overflow:hidden; }
.card-2 { width:1024px; height:1536px; position:relative; overflow:hidden; background:#F8F4EF; }
.product-img { position:absolute; top:80px; left:50%; transform:translateX(-50%); width:85%; height:65%; object-fit:contain; }
.label-box { position:absolute; bottom:280px; left:0; right:0; text-align:center; }
.label-box .chinese { font-family:'Noto Serif SC',serif; font-size:56px; color:#2C2C2C; font-weight:700; letter-spacing:10px; }
.label-box .english { font-family:'Inter',sans-serif; font-size:22px; color:#8B7355; margin-top:12px; letter-spacing:4px; }
.tagline { position:absolute; bottom:180px; left:0; right:0; text-align:center; font-size:22px; color:#555; font-family:'Noto Sans SC',sans-serif; }
.footer { position:absolute; bottom:80px; left:0; right:0; text-align:center; font-size:18px; color:#999; letter-spacing:6px; }
</style>
</head>
<body>
<div class="card-2">
  <img class="product-img" src="../../images/tea-set-group.png">
  <div class="label-box">
    <div class="chinese">经典壶杯套件</div>
    <div class="english">Classic Teapot & Cup Set</div>
  </div>
  <div class="tagline">手能摸到的弧度，数学能算到微米级</div>
  <div class="footer">@正窑陶瓷艺术工作室</div>
</div>
</body>
</html>
